<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="google-site-verification" content="google02e2feaa58246bb6" />
    
    <!-- SEO Meta Tags -->
    <title>VELORA | Account Registration & Profile Setup</title>
    <meta name="description" content="Create your VELORA account to unlock automated income streaming, YouTube engagement earnings, AI uploads, and daily payouts.">
    <meta name="keywords" content="Velora register, Velora signup, create Velora account, Velora platform login">

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="VELORA | Create Your Account">
    <meta property="og:description" content="Initialize your VELORA profile and start earning in dollars globally.">
    <meta property="og:image" content="https://veloraofficial.vercel.app/velora1.jpg">
    <meta property="og:url" content="https://veloraofficial.vercel.app/register.html">

    <!-- Styles & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        velora: {
                            bgCream: '#FDFBF7',
                            navyDeep: '#0A1128',
                            navyText: '#1C2541',
                            purpleAccent: '#4A148C',
                            purpleHover: '#320B61',
                            mutedGray: '#6C757D'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FDFBF7; color: #1C2541; }
        .luxury-card {
            background: #FFFFFF;
            border: 1px solid rgba(74, 20, 140, 0.08);
            box-shadow: 0 20px 40px rgba(10, 17, 40, 0.04);
        }

        /* 3D Glassmorphic Live Notification Pop-Up Styling */
        .live-popup-3d {
            perspective: 1000px;
            transform-style: preserve-3d;
            box-shadow: 0 12px 30px -5px rgba(10, 17, 40, 0.25), 0 0 15px rgba(74, 20, 140, 0.15);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .live-popup-3d:hover {
            transform: translateY(4px) rotateX(-4deg) rotateY(2deg) scale(1.02);
        }

        /* Pulse Indicator */
        .pulse-dot {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 1.8s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between bg-velora-bgCream relative">

    <!-- 3D LIVE POPUP CONTAINER (TOP POSITIONED) -->
    <div id="livePopup" class="fixed top-5 right-5 sm:right-6 z-50 transform -translate-y-24 opacity-0 transition-all duration-500 max-w-[320px] sm:max-w-xs w-full pointer-events-auto">
        <div class="live-popup-3d rounded-2xl p-3.5 flex items-center gap-3">
            <div class="relative flex-shrink-0">
                <div id="popupAvatar" class="w-10 h-10 rounded-full bg-velora-purpleAccent/10 border border-velora-purpleAccent/20 flex items-center justify-center text-velora-purpleAccent font-black text-sm">
                    <!-- Dynamically set initials -->
                </div>
                <span class="pulse-dot absolute -top-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white"></span>
            </div>
            <div class="flex-grow min-w-0">
                <div class="flex items-center justify-between">
                    <p id="popupName" class="text-xs font-bold text-velora-navyDeep truncate"></p>
                    <span id="popupFlag" class="text-sm ml-1"></span>
                </div>
                <p id="popupAction" class="text-[11px] text-emerald-600 font-semibold truncate"></p>
                <p id="popupTime" class="text-[9px] text-velora-mutedGray mt-0.5"></p>
            </div>
        </div>
    </div>

    <header class="w-full py-6 px-6 border-b border-purple-900/10 bg-white/60 backdrop-blur-md flex justify-between items-center">
        <a href="index.html" class="text-2xl font-extrabold text-velora-navyDeep tracking-tight">V<span class="text-velora-purpleAccent">e</span>lora</a>
        <a href="index.html" class="text-xs font-semibold text-velora-mutedGray hover:text-velora-purpleAccent transition flex items-center gap-1.5">
            <i class="fas fa-arrow-left text-[10px]"></i> Back to Landing
        </a>
    </header>

    <main class="w-full max-w-md mx-auto px-4 py-12 flex-grow flex flex-col justify-center">
        <div class="luxury-card rounded-3xl p-8">
            <h1 class="text-2xl font-extrabold text-velora-navyDeep mb-2 tracking-tight">Set Up Your Profile</h1>
            <p class="text-xs text-velora-mutedGray mb-6 leading-relaxed">Fill out your profile details below to customize your experience and activate your account parameters.</p>

            <form id="registrationForm" onsubmit="handleRegistration(event)" class="space-y-5">
                <!-- Country Selection -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-velora-mutedGray font-bold mb-2">Select Country</label>
                    <div class="relative">
                        <i class="fas fa-globe absolute left-4 top-1/2 transform -translate-y-1/2 text-velora-mutedGray/60 text-xs"></i>
                        <select id="country" required onchange="updatePlanOptions()" class="w-full bg-velora-bgCream border border-purple-900/10 rounded-xl py-3 pl-10 pr-10 text-sm text-velora-navyDeep focus:outline-none focus:border-velora-purpleAccent focus:ring-1 focus:ring-velora-purpleAccent appearance-none transition cursor-pointer">
                            <option value="NG">Nigeria 🇳🇬</option>
                            <option value="GH">Ghana 🇬🇭</option>
                            <option value="CM">Cameroon 🇨🇲</option>
                            <option value="ZA">South Africa 🇿🇦</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-velora-mutedGray/60 text-xs pointer-events-none"></i>
                    </div>
                </div>

                <!-- Username Input -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-velora-mutedGray font-bold mb-2">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-velora-mutedGray/60 text-xs"></i>
                        <input type="text" id="username" required placeholder="Choose a unique username" class="w-full bg-velora-bgCream border border-purple-900/10 rounded-xl py-3 pl-10 pr-4 text-sm text-velora-navyDeep placeholder-velora-mutedGray/50 focus:outline-none focus:border-velora-purpleAccent focus:ring-1 focus:ring-velora-purpleAccent transition">
                    </div>
                </div>

                <!-- Email Input -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-velora-mutedGray font-bold mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-velora-mutedGray/60 text-xs"></i>
                        <input type="email" id="email" required placeholder="example@gmail.com" class="w-full bg-velora-bgCream border border-purple-900/10 rounded-xl py-3 pl-10 pr-4 text-sm text-velora-navyDeep placeholder-velora-mutedGray/50 focus:outline-none focus:border-velora-purpleAccent focus:ring-1 focus:ring-velora-purpleAccent transition">
                    </div>
                </div>

                <!-- Phone Input -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-velora-mutedGray font-bold mb-2">Phone Number</label>
                    <div class="relative">
                        <i class="fas fa-phone absolute left-4 top-1/2 transform -translate-y-1/2 text-velora-mutedGray/60 text-xs"></i>
                        <input type="tel" id="phone" required placeholder="e.g. 08123456789" class="w-full bg-velora-bgCream border border-purple-900/10 rounded-xl py-3 pl-10 pr-4 text-sm text-velora-navyDeep placeholder-velora-mutedGray/50 focus:outline-none focus:border-velora-purpleAccent focus:ring-1 focus:ring-velora-purpleAccent transition">
                    </div>
                </div>

                <!-- Dynamic Plan Selection -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-velora-mutedGray font-bold mb-2">Select Membership Tier</label>
                    <div class="relative">
                        <i class="fas fa-layer-group absolute left-4 top-1/2 transform -translate-y-1/2 text-velora-mutedGray/60 text-xs"></i>
                        <select id="tierPlan" required class="w-full bg-velora-bgCream border border-purple-900/10 rounded-xl py-3 pl-10 pr-10 text-sm text-velora-navyDeep focus:outline-none focus:border-velora-purpleAccent focus:ring-1 focus:ring-velora-purpleAccent appearance-none transition cursor-pointer">
                            <!-- Populated via JavaScript -->
                        </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-velora-mutedGray/60 text-xs pointer-events-none"></i>
                    </div>
                </div>

                <button type="submit" class="w-full mt-2 bg-velora-purpleAccent hover:bg-velora-purpleHover text-white font-extrabold py-3.5 rounded-xl transition transform active:scale-[0.98] shadow-xl shadow-velora-purpleAccent/10 flex justify-center items-center gap-2">
                    Proceed to Checkout <i class="fas fa-arrow-right text-xs"></i>
                </button>

                <!-- 72-Hour Guarantee Reassurance Badge -->
                <div class="pt-2 text-center">
                    <p class="text-[11px] text-velora-mutedGray flex items-center justify-center gap-1.5 font-medium">
                        <i class="fas fa-shield-halved text-emerald-600"></i> Protected by our 
                        <a href="index.html#refund-policy" class="text-velora-purpleAccent hover:underline font-bold">72-Hour Guarantee</a>
                    </p>
                </div>
            </form>
        </div>
    </main>

    <footer class="py-6 text-center text-[10px] text-velora-mutedGray border-t border-purple-900/5 bg-white/40 space-y-2">
        <p class="flex justify-center items-center gap-1.5">
            <i class="fas fa-shield-alt text-velora-mutedGray/80"></i> Data stored securely under protected local session protocols.
        </p>
        <div>
            <a href="index.html#refund-policy" class="hover:text-velora-purpleAccent underline transition font-semibold">72-Hour Fulfillment Guarantee & Refund Policy</a>
        </div>
    </footer>

    <script>
        const MY_WHATSAPP = "2348130375700";

        const plansByCountry = {
            NG: [
                { value: 'platinum', text: 'Velora Platinum Plan — ₦9,000' },
                { value: 'gold', text: 'Velora Gold Plan — ₦14,500' }
            ],
            GH: [
                { value: 'platinum', text: 'Velora Platinum Plan — 170 GHS' },
                { value: 'gold', text: 'Velora Gold Plan — 250 GHS' }
            ],
            CM: [
                { value: 'platinum', text: 'Velora Platinum Plan — 7,500 XAF' },
                { value: 'gold', text: 'Velora Gold Plan — 12,000 XAF' }
            ],
            ZA: [
                { value: 'platinum', text: 'Velora Platinum Plan — 200 ZAR' },
                { value: 'gold', text: 'Velora Gold Plan — 320 ZAR' }
            ]
        };

        function updatePlanOptions() {
            const country = document.getElementById('country').value;
            const planSelect = document.getElementById('tierPlan');
            const options = plansByCountry[country] || plansByCountry.NG;

            planSelect.innerHTML = options.map(p => `<option value="${p.value}">${p.text}</option>`).join('');
        }

        /* 25 Live Registration Pop-Up Data Pool across 4 Target Countries */
        const liveRegistrations = [
            { name: "Chidubem O.", flag: "🇳🇬", plan: "Gold Plan (₦14,500)", time: "2 mins ago" },
            { name: "Kofi A.", flag: "🇬🇭", plan: "Platinum Plan (170 GHS)", time: "Just now" },
            { name: "Sipho M.", flag: "🇿🇦", plan: "Gold Plan (320 ZAR)", time: "4 mins ago" },
            { name: "Jean-Paul K.", flag: "🇨🇲", plan: "Platinum Plan (7,500 XAF)", time: "1 min ago" },
            { name: "Amina B.", flag: "🇳🇬", plan: "Platinum Plan (₦9,000)", time: "3 mins ago" },
            { name: "Kwame A.", flag: "🇬🇭", plan: "Gold Plan (250 GHS)", time: "5 mins ago" },
            { name: "Tebogo N.", flag: "🇿🇦", plan: "Platinum Plan (200 ZAR)", time: "Just now" },
            { name: "Samuel E.", flag: "🇨🇲", plan: "Gold Plan (12,000 XAF)", time: "6 mins ago" },
            { name: "Blessing I.", flag: "🇳🇬", plan: "Gold Plan (₦14,500)", time: "1 min ago" },
            { name: "Yaw O.", flag: "🇬🇭", plan: "Platinum Plan (170 GHS)", time: "2 mins ago" },
            { name: "Thabo Z.", flag: "🇿🇦", plan: "Gold Plan (320 ZAR)", time: "Just now" },
            { name: "Marie N.", flag: "🇨🇲", plan: "Platinum Plan (7,500 XAF)", time: "4 mins ago" },
            { name: "Emeka U.", flag: "🇳🇬", plan: "Platinum Plan (₦9,000)", time: "3 mins ago" },
            { name: "Ama S.", flag: "🇬🇭", plan: "Gold Plan (250 GHS)", time: "2 mins ago" },
            { name: "Lindiwe D.", flag: "🇿🇦", plan: "Platinum Plan (200 ZAR)", time: "5 mins ago" },
            { name: "Franck T.", flag: "🇨🇲", plan: "Gold Plan (12,000 XAF)", time: "Just now" },
            { name: "Damilola A.", flag: "🇳🇬", plan: "Gold Plan (₦14,500)", time: "1 min ago" },
            { name: "Ebo B.", flag: "🇬🇭", plan: "Platinum Plan (170 GHS)", time: "4 mins ago" },
            { name: "Bongani K.", flag: "🇿🇦", plan: "Gold Plan (320 ZAR)", time: "2 mins ago" },
            { name: "Alain M.", flag: "🇨🇲", plan: "Platinum Plan (7,500 XAF)", time: "3 mins ago" },
            { name: "Toluwani P.", flag: "🇳🇬", plan: "Platinum Plan (₦9,000)", time: "Just now" },
            { name: "Akosua F.", flag: "🇬🇭", plan: "Gold Plan (250 GHS)", time: "6 mins ago" },
            { name: "Zinhle N.", flag: "🇿🇦", plan: "Platinum Plan (200 ZAR)", time: "1 min ago" },
            { name: "Guy B.", flag: "🇨🇲", plan: "Gold Plan (12,000 XAF)", time: "5 mins ago" },
            { name: "Nkechi E.", flag: "🇳🇬", plan: "Gold Plan (₦14,500)", time: "Just now" }
        ];

        let currentRegIndex = 0;

        function triggerLivePopup() {
            const popup = document.getElementById('livePopup');
            const data = liveRegistrations[currentRegIndex];

            // Get Initials
            const initials = data.name.split(' ').map(n => n[0]).join('');
            document.getElementById('popupAvatar').innerText = initials;
            document.getElementById('popupName').innerText = data.name;
            document.getElementById('popupFlag').innerText = data.flag;
            document.getElementById('popupAction').innerText = `Registered: ${data.plan}`;
            document.getElementById('popupTime').innerText = `Verified • ${data.time}`;

            // Animate Down from Top
            popup.classList.remove('-translate-y-24', 'opacity-0');
            popup.classList.add('translate-y-0', 'opacity-100');

            // Slide back up after 4 seconds
            setTimeout(() => {
                popup.classList.remove('translate-y-0', 'opacity-100');
                popup.classList.add('-translate-y-24', 'opacity-0');
            }, 4000);

            // Increment loop index
            currentRegIndex = (currentRegIndex + 1) % liveRegistrations.length;
        }

        window.addEventListener('DOMContentLoaded', () => {
            updatePlanOptions();
            
            // Auto-select plan from query params if coming from landing page
            const params = new URLSearchParams(window.location.search);
            const planParam = params.get('plan');
            if (planParam) {
                document.getElementById('tierPlan').value = planParam.toLowerCase();
            }

            // Start Live Popup Cycle (Triggers every 6.5s)
            setTimeout(triggerLivePopup, 1500); // Initial trigger
            setInterval(triggerLivePopup, 6500);
        });

        function handleRegistration(e) {
            e.preventDefault();
            const country = document.getElementById('country').value;
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const planSelect = document.getElementById('tierPlan');
            const planText = planSelect.options[planSelect.selectedIndex].text;

            // NIGERIA: Go to Squad Payment Gateway
            if (country === 'NG') {
                window.location.href = `payment.html?country=${encodeURIComponent(country)}&plan=${encodeURIComponent(planSelect.value)}&user=${encodeURIComponent(username)}&email=${encodeURIComponent(email)}&phone=${encodeURIComponent(phone)}`;
            } 
            // OTHER COUNTRIES: Direct to WhatsApp
            else {
                const countryNames = { GH: 'Ghana 🇬🇭', CM: 'Cameroon 🇨🇲', ZA: 'South Africa 🇿🇦' };
                const selectedCountryName = countryNames[country] || country;

                const msg = `Hello 👋\n\nI want to register for VELORA from ${selectedCountryName}!\n\n👤 Username: ${username}\n📧 Email: ${email}\n📞 Phone: ${phone}\n📦 Selected Package: ${planText}\n\nPlease guide me on how to make my payment!`;

                window.location.href = `https://wa.me/${MY_WHATSAPP}?text=${encodeURIComponent(msg)}`;
            }
        }
    </script>
</body>
</html>
